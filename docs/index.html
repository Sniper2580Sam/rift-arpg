  :root { --bg:#0b0710; --panel:#140c1cee; --line:#4a3b5a; --text:#e9e1f5; --dim:#9a8cb0; --accent:#ff8a1f; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; overscroll-behavior:none;
    font-family:"GameFont", ui-monospace, monospace; font-synthesis:none; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  canvas#game { position:fixed; inset:0; touch-action:none; display:block; }
  #ui.screen { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:16px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; box-sizing:border-box; overflow:auto; background:rgba(5,2,10,.55); }
  #ui.hudbtns { position:fixed; display:flex; gap:6px; }
  #ui.hudbtns button { padding:6px 10px; font-size:13px; }
  #ui.hudbtns button.boon-ready { color:#140c1c; background:#ffd23f; border-color:#fff2a8; animation:boonpulse 1s ease-in-out infinite alternate; }
  @keyframes boonpulse { from { box-shadow:0 3px 0 #000, 0 0 0 #ffd23f; } to { box-shadow:0 3px 0 #000, 0 0 12px #ffd23f; } }
  .panel { background:var(--panel); border:2px solid var(--line); padding:16px; max-width:560px; width:100%; box-shadow:0 0 0 2px #000, 0 10px 40px #000a; margin:auto; }
  h1 { margin:0; font-size:40px; color:var(--accent); letter-spacing:2px; text-shadow:3px 3px 0 #000; }
  h2 { margin:0 0 6px; color:#7dff9a; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:12px; }
  .class-card { border:2px solid var(--line); padding:10px; margin:8px 0 12px; background:#1b1424; }
  .cls { font-size:18px; color:#ffd23f; margin-bottom:6px; }
  .skills { display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:13px; }
  .tags { color:var(--accent); font-size:11px; }
  .dim { color:var(--dim); }
  b, strong, h1, h2, h3, h4, th { font-weight:400; }
  button { font-family:inherit; font-size:15px; color:var(--text); background:#2b1f3a; border:2px solid var(--line); padding:8px 14px; cursor:pointer; box-shadow:0 3px 0 #000; }
  button:hover { background:#3a2a4e; } button:active { transform:translateY(2px); box-shadow:0 1px 0 #000; }
  button.big { width:100%; font-size:20px; padding:12px; background:#5a2a12; border-color:var(--accent); color:#ffe9c9; margin:6px 0; }
  button.warn { border-color:#8c2a35; } button.tiny { font-size:11px; padding:3px 8px; margin-top:10px; background:none; box-shadow:none; color:var(--dim); }
  input { font-family:inherit; font-size:15px; background:#1b1424; color:var(--text); border:2px solid var(--line); padding:8px; flex:1; min-width:0; text-transform:uppercase; }
  .row { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
  .stats { font-size:13px; color:var(--dim); margin:8px 0; }
  .help { font-size:12px; line-height:1.5; margin-top:8px; }
  .inv-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .statline { font-size:12px; color:var(--dim); margin-bottom:10px; }
  .doll { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:10px; }
  .bag { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; }
  .cell { aspect-ratio:1; background:#1b1424; border:2px solid #2f2540; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; font-size:10px; color:var(--dim); }
  .cell .pl { position:absolute; bottom:0; left:2px; color:#7dff9a; font-style:normal; font-size:10px; font-weight:bold; text-shadow:0 0 2px #000, 0 0 2px #000; }
  .cell .pl.mw { color:#ffd23f; }
  .it-affix.mw { color:#ffd23f; }
  .it-plus { color:#7dff9a; font-size:12px; }
  .cell .lk { position:absolute; top:0; right:2px; color:#ffd23f; font-style:normal; font-size:11px; text-shadow:0 0 2px #000; }
  .builds { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin:4px 0 6px; } .builds button { font-size:12px; padding:6px 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .builds button.on { border-color:#ffd23f; background:#3a2a1a; } .builds button.empty { color:var(--dim); }
  .warn-t { color:#ff8a5a; }
  .cell img { width:80%; height:80%; image-rendering:pixelated; }
  .cell.eq { border-style:dashed; } .cell.on { outline:2px solid #fff; }
  .cell.r-common { border-color:#6d6d6d; border-style:solid; } .cell.r-magic { border-color:#5b8cff; border-style:solid; }
  .cell.r-rare { border-color:#ffd84a; border-style:solid; } .cell.r-legendary { border-color:#ff8a1f; border-style:solid; box-shadow:inset 0 0 10px #ff8a1f88; }
  .cell i.sb { position:absolute; left:3px; top:0; font-style:normal; font-size:10px; font-weight:bold; text-shadow:0 0 2px #000, 0 0 2px #000; }
  .cell i.up { position:absolute; right:2px; top:0; color:#7dff9a; font-style:normal; font-size:11px; }
  .cell.empty { cursor:default; }
  .detail { margin-top:10px; min-height:120px; border-top:2px solid var(--line); padding-top:8px; font-size:14px; }
  .it-name { font-size:18px; } .it-type { color:var(--dim); font-size:12px; margin-bottom:4px; }
  .it-base { color:#fff; } .it-affix { color:#8fb0ff; } .it-power { color:var(--accent); font-style:italic; margin-top:4px; }
  .it-compare { margin-top:6px; font-size:13px; } .up { color:#7dff9a; } .down { color:#ff6a6a; }
  .big-time { font-size:42px; color:#ffd23f; margin:4px 0; }
  .legs { margin:8px 0; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#140c1cdd; border:2px solid var(--line); padding:6px 12px; font-size:14px;
    opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }

  .hub { max-width:720px; }
  .hub-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .sk-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0; }
  .sk-slot { display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:8px; text-align:left; } .sk-slot.on { border-color:#ffd23f; background:#3a2a10; }
  .sk-slot b { font-size:13px; } .sk-slot small, .sk-slot span { font-size:10px; }
  h3.sk-type { margin:14px 0 4px; font-size:14px; color:#ffd23f; }
  .skill.inbar { border-color:#8a5cff; } .skill .eq { color:#7dff9a; font-size:12px; } .skill .equip { margin-left:auto; padding:4px 8px; font-size:12px; min-height:0; }
  .sk-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .coop { border:2px solid #3a2d4c; background:#1b1424; padding:10px; margin:8px 0 12px; display:flex; flex-direction:column; gap:6px; }
  .coop ul { margin:2px 0; padding-left:18px; } .coop input { width:7em; text-transform:uppercase; }
  button.link { background:none; border:none; padding:0; color:#c9b8ff; text-decoration:underline; font:inherit; min-height:0; box-shadow:none; }
  .signin { max-width:360px; display:flex; flex-direction:column; gap:10px; } .signin input { font-size:16px; } .err { color:#ff6a6a; min-height:1.2em; }
  .who { text-align:right; font-size:14px; } @media (max-width:520px){ .who{font-size:12px; text-align:left;} .xpbar{width:100%; margin-left:0;} } .xpbar { width:140px; height:6px; background:#1b1424; margin-top:4px; margin-left:auto; } .xpbar i { display:block; height:100%; background:#7dff9a; }
  .subtabs { display:flex; flex-wrap:wrap; gap:4px; margin:0 0 8px; } .subtabs button { flex:1 1 auto; padding:6px 8px; font-size:12px; } .subtabs button.on { background:#3a2a52; border-color:#c9b8ff; color:#fff; } .sub-intro { margin-bottom:8px; }
  .tabs { display:flex; gap:4px; margin:12px 0 10px; } .tab { flex:1; padding:8px 4px; font-size:14px; } .tab.on { background:#5a2a12; border-color:var(--accent); }
  .tab-body { display:flex; flex-direction:column; gap:8px; }
  .classes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cls-card { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:10px; } .cls-card.on { border-color:#ffd23f; background:#3a2a1a; }
  .cls-card span { color:var(--accent); font-size:12px; } .cls-card small { color:var(--dim); font-size:11px; }
  .tier-row { display:flex; align-items:center; gap:8px; } .tier-row > button { width:44px; height:44px; font-size:22px; padding:0; }
  .tier { flex:1; text-align:center; } .tier b { font-size:22px; color:#ffd23f; display:block; } .tier small { color:var(--dim); font-size:11px; }
  .small { font-size:12px; } button:disabled { opacity:.45; cursor:default; }
  button.chase { border-color:#ff3b6b; color:#ffc0d0; }
  button.trial { border-color:#3ab0ff; color:#bfe8ff; }
  .tags{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}.tag{font-size:0.75em;padding:0 5px;border:1px solid var(--c);color:var(--c);border-radius:3px;text-transform:capitalize}
  .death{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,92vw);background:#1b1424ee;border:2px solid #ff4a4a;padding:12px;z-index:40;display:flex;flex-direction:column;gap:6px}.death-title{color:#ff6a6a;font-size:1.4em}.recap{display:flex;flex-direction:column;gap:3px}.rc-row{display:grid;grid-template-columns:1fr 70px auto;gap:6px;align-items:center;font-size:0.85em}.rc-bar{height:6px;background:#2a2036}.rc-bar i{display:block;height:100%;background:#ff6a6a}
  .ptree{max-width:420px;display:block;margin:4px auto;background:#120c18;border:1px solid #2a2036}.pn-info{padding:4px 0}
  .abyss { color:#ff4a6a; font-size:0.8em; }
  button.vault { border-color:#c9a23a; color:#ffe9a0; }
