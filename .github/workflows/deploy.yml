# Publishes the game to Cloudflare Pages on every push to main: the prebuilt docs/ folder (npm run site)
# plus functions/ (the /api/turn relay-key function).
name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "functions/**", ".github/workflows/deploy.yml"]
concurrency: deploy
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Skip until Cloudflare is set up
        id: ready
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "No Cloudflare secrets yet: nothing to do (see CLOUDFLARE.md)." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v4
      - name: Publish
        if: steps.ready.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy docs --project-name riftbound --branch main --commit-dirty=true
      - name: Check the live site and relay
        if: steps.ready.outputs.go == '1'
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" https://riftbound-7pq.pages.dev/)
          relay=$(curl -fsS https://riftbound-7pq.pages.dev/api/turn | jq -r '.relay')
          echo "Site: $code · relay: $relay · https://riftbound-7pq.pages.dev" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] && [ "$relay" = true ]
